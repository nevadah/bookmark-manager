version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Keep @types/node on the runtime's major (Node 24, see Dockerfile)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
